 for(var i=0;i<pile.length;i++){var p=pile[i],x=p.fx*W,y=H-p.fb;drawLeaf(gP,p,x,y,p.sq,p.rf,p.side,1,.22)}}
function settle(L){var x=L.x,w=L.w,y=L.ly;
 var p={v:L.v,w:w,fx:x/W,fb:H-y,sq:L.sq,rf:L.rf,side:L.side,o:pile.length?pile[pile.length-1].o+1:0};
 pile.push(p);bump(x,w*.9,w*L.sq*.16);
 if(pile.length>CAP){pile.shift()}
 paintPile()}
function seed(n){for(var i=0;i<n;i++){var L=newLeaf(0);L.x=i%4==3?W/2+rnd(-.22,.22)*W:rnd(0,1)*W;
 if(L.x>bandL-30&&L.x<bandR+30){var md2=(bandL+bandR)/2;L.x=L.x<md2?Math.max(14,bandL-46):Math.min(W-14,bandR+46)}
 var h=hAt(L.x,L.w);L.ly=landY(L.z)-h;L.rf=rnd(-3.14,3.14);L.side=Math.random()<.3?-1:1;
 var p={v:L.v,w:L.w,fx:L.x/W,fb:H-L.ly,sq:L.sq,rf:L.rf,side:L.side,o:i};pile.push(p);bump(L.x,L.w*.9,L.w*L.sq*.16)}paintPile()}
function step(L,dt){L.t+=dt;var t=L.t;
 L.y+=L.vy*dt;L.x0+=L.drift*dt;
 var sw=Math.sin(t*6.283*L.sf+L.ph);L.x=L.x0+L.sa*sw;
 L.rot=L.r0+L.ra*Math.cos(t*6.283*L.sf+L.ph)+L.spin*t;
 L.fx=L.tumble?Math.cos(L.fl+t*L.fs):Math.cos(L.fa*Math.sin(L.fl+t*L.fs));
 L.fy=.82+.18*Math.cos(L.tilt+t*L.ts);
 if(L.y-L.w>H+60)return false;
 return true}
var cap=location.hash==='#capture';
function frame(ts){if(!running)return;var dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;render(dt);if(!cap)requestAnimationFrame(frame)}
function render(dt){
 spawnT-=dt;if(spawnT<=0&&fall.length<MAXFALL){fall.push(newLeaf());spawnT=rnd(.18,.42)}
 gF.setTransform(DPR,0,0,DPR,0,0);gF.clearRect(0,0,W,H);gF.imageSmoothingQuality='high';
 for(var i=fall.length-1;i>=0;i--){var L=fall[i];if(!step(L,dt)){fall.splice(i,1)}}
 for(i=0;i<fall.length;i++){L=fall[i];drawLeaf(gF,L,L.x,L.y,1,L.rot,L.fx,L.fy,0)}}
function start(){size();for(var i=0;i<spr.length;i++)build(i);
 if(reduce){for(i=0;i<8;i++)fall.push(newLeaf(rnd(.05,.85)*H));render(0);return}
 for(i=0;i<Math.min(8,MAXFALL);i++){var L=newLeaf(rnd(.05,.85)*H);fall.push(L)}
 running=true;last=0;if(cap){window.__nfTick=function(s){var n=Math.round(s*60);for(var i=0;i<n;i++)render(1/60);return pile.length};window.__nfReady=true}else requestAnimationFrame(frame)}
var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){var ow=W;size();if(!ready)return;for(var i=0;i<spr.length;i++)build(i);
 hm=new Array(Math.ceil(W/HB)+2).fill(0);for(i=0;i<pile.length;i++){var p=pile[i];bump(p.fx*W,p.w*.9,p.w*p.sq*.16)}paintPile();fall.length=0},150)});
SRC.forEach(function(u,i){var im=new Image();im.decoding='async';im.onload=function(){spr[i]={img:im};if(++ready===SRC.length){(document.fonts?document.fonts.ready:Promise.resolve()).then(start)}};im.src=u});
})();
</script>
