<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bletel #278 - Read Online</title>
<meta name="description" content="Read Bletel #278, published Nov 25, 2026. Montreal / Tosh weekly advertising publication.">
<meta property="og:site_name" content="Bletel">
<meta property="og:type" content="website">
<meta property="og:title" content="Bletel #278">
<meta property="og:description" content="Read Bletel #278 online - published Nov 25, 2026.">
<meta property="og:url" content="https://www.bletel.ca/pdf/">
<meta property="og:image" content="https://www.bletel.ca/img/covers/cocx.jpg?v=2">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Bletel #278">
<meta name="twitter:description" content="Read Bletel #278 online - published Nov 25, 2026.">
<meta name="twitter:image" content="https://www.bletel.ca/img/covers/cocx.jpg?v=2">
<link rel="icon" href="/favicon.ico">
<style>
  :root{
    --navy:#021f42; --navy2:#0a2f5c; --blue:#8cbdde; --white:#eaf5fe;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(ellipse at 80% 15%, rgba(201,230,251,.16), rgba(201,230,251,0) 55%), linear-gradient(160deg, #0a2f5c 0%, #021f42 55%, #011630 100%);
    background-attachment:fixed;
    color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; background:rgba(0,0,0,.28); flex:0 0 auto; gap:10px;
  }
  .wordmark{display:flex; align-items:center; white-space:nowrap; text-decoration:none;}
  .wordmark img{height:26px; width:auto; display:block;}
  .issue{font-size:14px; color:#fff; font-weight:600; white-space:nowrap;}
  .homelink{font-size:13px; color:#fff; text-decoration:none; white-space:nowrap;}
  #viewer{
    flex:1 1 auto; position:relative; overflow:auto;
    display:flex; align-items:flex-start; justify-content:center;
    padding:12px 8px;
  }
  #page{
    background:#fff; box-shadow:0 6px 28px rgba(0,0,0,.55);
    max-width:none; border-radius:2px;
  }
  .tapzone{position:absolute; top:0; bottom:0; width:28%; z-index:2; cursor:pointer;}
  #tapL{left:0;} #tapR{right:0;}
  #loader{
    position:absolute; inset:0; z-index:5; background:radial-gradient(ellipse at 80% 15%, rgba(201,230,251,.16), rgba(201,230,251,0) 55%), linear-gradient(160deg, #0a2f5c 0%, #021f42 55%, #011630 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  }
  #loader .wordmark img{height:44px;}
  #bar{width:min(280px,70%); height:5px; background:rgba(255,255,255,.18); border-radius:3px; overflow:hidden;}
  #fill{height:100%; width:0%; background:var(--blue); transition:width .15s;}
  #pct{font-size:13px; color:var(--blue);}
  #spinner{
    position:absolute; top:50%; left:50%; z-index:3; margin:-17px 0 0 -17px;
    width:34px; height:34px; border-radius:50%;
    border:4px solid rgba(140,189,222,.3); border-top-color:var(--blue);
    animation:spin .8s linear infinite; display:none;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  footer{
    flex:0 0 auto; background:rgba(0,0,0,.32);
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    flex-wrap:wrap;
  }
  footer button{
    background:rgba(255,255,255,.1); color:var(--white);
    border:1px solid rgba(140,189,222,.4); border-radius:8px;
    font-size:15px; font-weight:600; padding:8px 13px; cursor:pointer;
    touch-action:manipulation; user-select:none;
  }
  footer button:disabled{opacity:.35; cursor:default;}
  footer button:active:not(:disabled){background:rgba(140,189,222,.35);}
  #pageno{font-size:14px; color:var(--white); min-width:86px; text-align:center; font-variant-numeric:tabular-nums;}
  #zoomlbl{font-size:13px; color:var(--blue); min-width:44px; text-align:center;}
  .sep{width:1px; height:22px; background:rgba(140,189,222,.35); margin:0 4px;}
  @media (max-width:480px){
    .wordmark img{height:22px;}
    .issue{font-size:12px;}
    footer{gap:4px; padding-left:4px; padding-right:4px;}
    footer button{padding:8px 8px; font-size:13px;}
    #pageno{min-width:76px; font-size:13px;}
    #zoomlbl{display:none;}
  }
</style>
</head>
<body>
<header>
  <a class="wordmark" href="https://www.bletel.ca/"><img src="/img/logo-light.svg" alt="בלעטל Bletel"></a>
  <span class="issue">Bletel #278 &middot; Nov 25, 2026</span>
  <a class="homelink" href="https://www.bletel.ca/">bletel.ca &rarr;</a>
</header>

<div id="viewer">
  <canvas id="page"></canvas>
  <div class="tapzone" id="tapL" title="Previous page"></div>
  <div class="tapzone" id="tapR" title="Next page"></div>
  <div id="spinner"></div>
  <div id="loader">
    <span class="wordmark"><img src="/img/logo-light.svg" alt="בלעטל Bletel"></span>
    <div id="bar"><div id="fill"></div></div>
    <span id="pct">Loading&hellip;</span>
  </div>
</div>

<footer>
  <button id="prev" type="button">&lsaquo; Prev</button>
  <span id="pageno">Page &ndash; / &ndash;</span>
  <button id="next" type="button">Next &rsaquo;</button>
  <span class="sep"></span>
  <button id="zout" type="button" title="Zoom out">&minus;</button>
  <span id="zoomlbl">Fit</span>
  <button id="zin" type="button" title="Zoom in">+</button>
  <button id="zfit" type="button" title="Fit to screen">Fit</button>
</footer>

<script src="/pdf/assets/pdf.min.js"></script>
<script>
(function(){
  var PDF_URL = './current.pdf';
  pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdf/assets/pdf.worker.min.js';

  var viewer = document.getElementById('viewer'),
      canvas = document.getElementById('page'),
      ctx = canvas.getContext('2d'),
      loader = document.getElementById('loader'),
      fill = document.getElementById('fill'),
      pct = document.getElementById('pct'),
      spinner = document.getElementById('spinner'),
      pageno = document.getElementById('pageno'),
      zoomlbl = document.getElementById('zoomlbl'),
      prevBtn = document.getElementById('prev'),
      nextBtn = document.getElementById('next');

  var pdfDoc = null, pageNum = 1, zoom = 1, renderTask = null, renderSeq = 0;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  var loadingTask = pdfjsLib.getDocument({url: PDF_URL});
  loadingTask.onProgress = function(p){
    if (p.total) {
      var pc = Math.round(100 * p.loaded / p.total);
      fill.style.width = pc + '%';
      pct.textContent = pc + '%';
    }
  };
  loadingTask.promise.then(function(doc){
    pdfDoc = doc;
    var start = parseInt((location.hash.match(/page=(\d+)/) || [])[1], 10);
    if (start >= 1 && start <= doc.numPages) pageNum = start;
    loader.style.display = 'none';
    render(pageNum);
  }).catch(function(err){
    pct.textContent = 'Could not load the issue. Please refresh.';
  });

  function fitScale(base){
    var cs = getComputedStyle(viewer);
    var w = viewer.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2;
    var h = viewer.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 2;
    return Math.min(w / base.width, h / base.height);
  }

  function render(num){
    if (!pdfDoc) return;
    var seq = ++renderSeq;
    if (renderTask) { try { renderTask.cancel(); } catch (e) {} }
    spinner.style.display = 'block';
    pdfDoc.getPage(num).then(function(page){
      if (seq !== renderSeq) return;
      var base = page.getViewport({scale: 1});
      var s = fitScale(base) * zoom;
      var vp = page.getViewport({scale: s * dpr});
      canvas.width = Math.floor(vp.width);
      canvas.height = Math.floor(vp.height);
      canvas.style.width = Math.floor(vp.width / dpr) + 'px';
      canvas.style.height = Math.floor(vp.height / dpr) + 'px';
      renderTask = page.render({canvasContext: ctx, viewport: vp});
      renderTask.promise.then(function(){
        if (seq !== renderSeq) return;
        renderTask = null;
        spinner.style.display = 'none';
        pageNum = num;
        pageno.textContent = 'Page ' + num + ' / ' + pdfDoc.numPages;
        zoomlbl.textContent = zoom === 1 ? 'Fit' : Math.round(zoom * 100) + '%';
        prevBtn.disabled = num <= 1;
        nextBtn.disabled = num >= pdfDoc.numPages;
        viewer.scrollTop = 0;
        history.replaceState(null, '', '#page=' + num);
      }).catch(function(err){
        if (err && err.name === 'RenderingCancelledException') return;
        spinner.style.display = 'none';
      });
    });
  }

  function go(d){
    var n = pageNum + d;
    if (n < 1 || n > pdfDoc.numPages) return;
    render(n);
  }

  prevBtn.addEventListener('click', function(){ go(-1); });
  nextBtn.addEventListener('click', function(){ go(1); });
  document.getElementById('tapL').addEventListener('click', function(){ go(-1); });
  document.getElementById('tapR').addEventListener('click', function(){ go(1); });
  document.getElementById('zin').addEventListener('click', function(){
    zoom = Math.min(zoom * 1.3, 4); render(pageNum);
  });
  document.getElementById('zout').addEventListener('click', function(){
    zoom = Math.max(zoom / 1.3, 0.5); render(pageNum);
  });
  document.getElementById('zfit').addEventListener('click', function(){
    zoom = 1; render(pageNum);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'ArrowRight') go(1);
  });
  var rsz;
  window.addEventListener('resize', function(){
    clearTimeout(rsz);
    rsz = setTimeout(function(){ render(pageNum); }, 200);
  });
})();
</script>
</body>
</html>
